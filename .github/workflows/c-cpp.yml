name: Build Pinix Kernel

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm build-essential

    - name: Build Kernel with Makefile
      run: |
        make
